<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honeypot — Carte des attaques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2ecc;
    --panel-solid: #121b2e;
    --landmass: #1b2740;
    --landmass-stroke: #2c3a5c;
    --grid: #1a2438;
    --accent: #e8935b;
    --accent-soft: #f2c879;
    --text: #e7ecf5;
    --text-muted: #8a93a8;
    --border: #263454;
    --heat-low: #6b3b1c;
    --heat-high: #ff9a3d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", sans-serif;
    overflow: hidden;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
  }

  header {
    position: absolute;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 22px 32px;
    z-index: 10;
    pointer-events: none;
  }

  .wordmark {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }

  .wordmark strong {
    color: var(--text);
    font-weight: 700;
  }

  .counter-block {
    text-align: right;
  }

  .counter-value {
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    color: var(--accent-soft);
    font-variant-numeric: tabular-nums;
  }

  .counter-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  footer {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom, 0px));
    left: 32px;
    right: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    z-index: 10;
    pointer-events: none;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    box-shadow: 0 0 8px var(--accent);
  }

  #rangeText { margin-right: 14px; }

  .legend {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-right: 18px;
  }

  .legend-bar {
    display: inline-block;
    width: 72px;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--heat-low), var(--heat-high));
  }

  svg { display: block; cursor: grab; }
  svg:active { cursor: grabbing; }

  .sphere {
    fill: #0e1626;
    stroke: var(--landmass-stroke);
    stroke-width: 0.6;
  }

  .country {
    fill: var(--landmass);
    stroke: var(--landmass-stroke);
    stroke-width: 0.6;
  }

  /* Pays ayant reçu des tentatives : la couleur de fond est posée en JS selon le rang. */
  .country.has-data { cursor: pointer; stroke: #0b1220; stroke-width: 0.5; }
  .country.has-data:hover { stroke: var(--accent-soft); stroke-width: 1.3; }
  .country.is-selected { stroke: var(--text); stroke-width: 1.5; }

  .graticule {
    fill: none;
    stroke: var(--grid);
    stroke-width: 0.5;
  }

  .marker-dot {
    fill: var(--accent);
    filter: drop-shadow(0 0 4px var(--accent));
    cursor: pointer;
  }

  .marker-dot.is-selected {
    fill: var(--accent-soft);
    filter: drop-shadow(0 0 8px var(--accent-soft));
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 3px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.12s ease;
    z-index: 20;
    white-space: nowrap;
  }

  .tooltip .tt-count { color: var(--accent-soft); }

  /* ---- Panneau de statistiques ---- */
  .stats-panel {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 70px);
    right: 0;
    bottom: max(36px, env(safe-area-inset-bottom, 0px));
    width: 300px;
    background: var(--panel);
    backdrop-filter: blur(6px);
    border-image: linear-gradient(to bottom, transparent, var(--border) 12%, var(--border) 88%, transparent) 1;
    border-left: 1px solid;
    border-radius: 10px 0 0 10px;
    padding: 44px 22px;
    overflow-y: auto;
    z-index: 15;
    transition: transform 0.25s ease;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 48px, black calc(100% - 48px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, black 48px, black calc(100% - 48px), transparent 100%);
  }

  .stats-panel.collapsed { transform: translateX(100%); }

  .stats-section { margin-bottom: 26px; }
  .stats-section:last-child { margin-bottom: 0; }

  .stats-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 12px;
  }

  .stats-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 10px;
  }

  .stats-row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
  }

  .stats-row-label {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 190px;
  }

  .stats-row-count { color: var(--accent-soft); flex-shrink: 0; }

  .stats-bar-track {
    height: 3px;
    background: var(--landmass);
    border-radius: 2px;
    overflow: hidden;
  }

  .stats-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }

  .stats-empty {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .stats-toggle {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 90px);
    right: 0;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-right: none;
    color: var(--text-muted);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 4px 0 0 4px;
    cursor: pointer;
    z-index: 16;
    display: none;
  }

  /* ---- Zoom ---- */
  .zoom-controls {
    position: absolute;
    left: 32px;
    bottom: max(64px, env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    flex-direction: column;
    z-index: 12;
  }

  .zoom-btn {
    width: 32px;
    height: 32px;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .zoom-btn:hover { color: var(--text); background: #17223a; }
  .zoom-btn:first-child { border-radius: 6px 6px 0 0; }
  .zoom-btn:last-child { border-radius: 0 0 6px 6px; border-top: none; }

  /* ---- Fiche detail (clic sur un point) ---- */
  .detail-card {
    position: absolute;
    bottom: max(64px, env(safe-area-inset-bottom, 0px) + 28px);
    left: 32px;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    border-radius: 4px;
    z-index: 17;
    min-width: 220px;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .detail-card.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .detail-card-close {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }

  .detail-card-country {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    padding-right: 16px;
  }

  .detail-card-count {
    font-size: 30px;
    font-weight: 700;
    color: var(--accent-soft);
    line-height: 1;
  }

  .detail-card-sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .empty-state {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0; /* ajuste dynamiquement en JS pour matcher le centrage du globe */
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    text-align: center;
    padding: 0 24px;
  }

  .empty-state .big { font-size: 20px; color: var(--text); }
  .empty-state .small {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--text-muted);
    max-width: 420px;
  }

  @media (max-width: 860px) {
    header { padding: 16px 18px; flex-direction: column; gap: 10px; align-items: flex-start; }
    .counter-block { text-align: left; }
    .counter-value { font-size: 34px; }
    footer { left: 18px; right: 18px; flex-direction: column; align-items: flex-start; gap: 6px; }

    .stats-panel {
      width: min(320px, 84vw);
      top: calc(env(safe-area-inset-top, 0px) + 130px);
    }
    .stats-panel.collapsed { transform: translateX(100%); }
    .stats-toggle { display: block; top: calc(env(safe-area-inset-top, 0px) + 130px); }

    .detail-card { left: 18px; right: 18px; min-width: unset; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wordmark"><strong>Honeypot</strong> — surveillance réseau</div>
    <div class="counter-block">
      <div class="counter-value" id="counterValue">—</div>
      <div class="counter-label">interactions</div>
    </div>
  </header>

  <svg id="map"></svg>

  <div class="tooltip" id="tooltip"></div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomIn" aria-label="Zoomer">+</button>
    <button class="zoom-btn" id="zoomOut" aria-label="Dézoomer">−</button>
  </div>

  <button class="stats-toggle" id="statsToggle">Statistiques</button>

  <aside class="stats-panel" id="statsPanel">
    <div class="stats-section">
      <div class="stats-title">Pays les plus actifs</div>
      <div id="topCountries"><div class="stats-empty">En attente de données…</div></div>
    </div>
    <div class="stats-section">
      <div class="stats-title">Activité par jour</div>
      <div id="topDates"><div class="stats-empty">En attente de données…</div></div>
    </div>
    <div class="stats-section">
      <div class="stats-title">Commandes les plus tapées</div>
      <div id="topCommands"><div class="stats-empty">En attente de données…</div></div>
    </div>
  </aside>

  <div class="detail-card" id="detailCard">
    <button class="detail-card-close" id="detailClose">×</button>
    <div class="detail-card-country" id="detailCountry"></div>
    <div class="detail-card-count" id="detailCount"></div>
    <div class="detail-card-sub" id="detailSub"></div>
  </div>

  <footer>
    <div><span class="status-dot"></span><span id="statusText">Connexion aux données…</span></div>
    <div>
      <span class="legend"><span>moins actif</span><span class="legend-bar"></span><span>plus actif</span></span>
      <span id="rangeText"></span>
      <span id="updatedText"></span>
    </div>
  </footer>
</div>

    "316": "GU", "320": "GT", "324": "GN", "328": "GY", "332": "HT", "334": "HM", "336": "VA",
    "340": "HN", "344": "HK", "348": "HU", "352": "IS", "356": "IN", "360": "ID", "364": "IR",
    "368": "IQ", "372": "IE", "376": "IL", "380": "IT", "384": "CI", "388": "JM", "392": "JP",
    "398": "KZ", "400": "JO", "404": "KE", "408": "KP", "410": "KR", "414": "KW", "417": "KG",
    "418": "LA", "422": "LB", "426": "LS", "428": "LV", "430": "LR", "434": "LY", "438": "LI",
    "440": "LT", "442": "LU", "446": "MO", "450": "MG", "454": "MW", "458": "MY", "462": "MV",
    "466": "ML", "470": "MT", "474": "MQ", "478": "MR", "480": "MU", "484": "MX", "492": "MC",
    "496": "MN", "498": "MD", "499": "ME", "500": "MS", "504": "MA", "508": "MZ", "512": "OM",
    "516": "NA", "520": "NR", "524": "NP", "528": "NL", "531": "CW", "533": "AW", "534": "SX",
    "535": "BQ", "540": "NC", "548": "VU", "554": "NZ", "558": "NI", "562": "NE", "566": "NG",
    "570": "NU", "574": "NF", "578": "NO", "580": "MP", "581": "UM", "583": "FM", "584": "MH",
    "585": "PW", "586": "PK", "591": "PA", "598": "PG", "600": "PY", "604": "PE", "608": "PH",
    "612": "PN", "616": "PL", "620": "PT", "624": "GW", "626": "TL", "630": "PR", "634": "QA",
    "638": "RE", "642": "RO", "643": "RU", "646": "RW", "652": "BL", "654": "SH", "659": "KN",
    "660": "AI", "662": "LC", "663": "MF", "666": "PM", "670": "VC", "674": "SM", "678": "ST",
    "682": "SA", "686": "SN", "688": "RS", "690": "SC", "694": "SL", "702": "SG", "703": "SK",
    "704": "VN", "705": "SI", "706": "SO", "710": "ZA", "716": "ZW", "724": "ES", "728": "SS",
    "729": "SD", "732": "EH", "740": "SR", "744": "SJ", "748": "SZ", "752": "SE", "756": "CH",
    "760": "SY", "762": "TJ", "764": "TH", "768": "TG", "772": "TK", "776": "TO", "780": "TT",
    "784": "AE", "788": "TN", "792": "TR", "795": "TM", "796": "TC", "798": "TV", "800": "UG",
    "804": "UA", "807": "MK", "818": "EG", "826": "GB", "831": "GG", "832": "JE", "833": "IM",
    "834": "TZ", "840": "US", "850": "VI", "854": "BF", "858": "UY", "860": "UZ", "862": "VE",
    "876": "WF", "882": "WS", "887": "YE", "894": "ZM"
  };

  const CC_RE = /^[A-Z]{2}$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const MAX_LABEL = 64;

  let regionNames = null;
  try { regionNames = new Intl.DisplayNames(["fr"], { type: "region" }); } catch (e) { regionNames = null; }

  function countryName(code) {
    if (!CC_RE.test(code)) return "Inconnu"; // inclut la valeur "Unknown"
    try {
      const n = regionNames && regionNames.of(code);
      if (n && n !== code) return n;
    } catch (e) { /* repli ci-dessous */ }
    return code;
  }

  function toCount(v) {
    const n = Number(v);
    return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
  }

  function asList(v) { return Array.isArray(v) ? v : []; }

  // Valide et normalise data.json : tout ce qui n'a pas la forme attendue est ecarte.
  function parsePayload(json) {
    const j = (json && typeof json === "object") ? json : {};
    const countries = asList(j.Country)
      .filter(r => r && (r.code === "Unknown" || CC_RE.test(r.code)) && toCount(r.count) > 0)
      .map(r => ({ code: r.code, count: toCount(r.count) }));
    const dates = asList(j.Date)
      .filter(r => r && typeof r.date === "string" && DATE_RE.test(r.date) && toCount(r.count) > 0)
      .map(r => ({ date: r.date, count: toCount(r.count) }));
    const commands = asList(j.Command)
      .filter(r => r && typeof r.command === "string" && toCount(r.count) > 0)
      .map(r => ({ command: r.command.slice(0, MAX_LABEL), count: toCount(r.count) }));
    return {
      total: toCount(j.total),
      since: (typeof j.since === "string" && DATE_RE.test(j.since)) ? j.since : null,
      generatedAt: typeof j.generated_at === "string" ? j.generated_at : null,
      countries: countries,
      dates: dates,
      commands: commands
    };
  }

  // Pays connus de la table de centroides -> points du globe.
  function pointsFromCountries(list) {
    const out = [];
    list.forEach(function (c) {
      const pos = CENTROIDS[c.code];
      if (pos) out.push({ code: c.code, country: countryName(c.code), count: c.count, lon: pos[0], lat: pos[1] });
    });
    return out;
  }

  // Code a deux lettres d'un pays du fond de carte (null si inconnu).
  function featureCode(f) {
    if (f && f.id !== undefined && f.id !== null) {
      const code = ISO_NUM[String(f.id).padStart(3, "0")];
      if (code) return code;
    }
    // Le Kosovo n'a pas de code numerique dans world-atlas.
    if (f && f.properties && f.properties.name === "Kosovo") return "XK";
    return null;
  }

  // Classement des pays : code -> { code, country, count, rank, t }.
  // t vaut 1 pour le pays en tete et tend vers 0 pour le dernier ;
  // deux pays a egalite ont le meme rang et donc la meme couleur.
  function rankCountries(list) {
    const known = list.filter(c => CC_RE.test(c.code)).sort((a, b) => b.count - a.count);
    const n = known.length;
    const out = {};
    let rank = 0;
    known.forEach(function (c, i) {
      if (i === 0 || c.count !== known[i - 1].count) rank = i + 1;
      out[c.code] = {
        code: c.code, country: countryName(c.code), count: c.count, rank: rank,
        t: n > 1 ? 1 - (rank - 1) / (n - 1) : 1
      };
    });
    return out;
  }

  function formatDate(iso, withYear) {
    const p = iso.split("-");
    return withYear ? p[2] + "/" + p[1] + "/" + p[0] : p[2] + "/" + p[1];
  }

  function mk(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // rows : [{ label, count }] deja tries ; barre proportionnelle au premier.
  function renderStatList(container, rows, emptyText) {
    container.replaceChildren();
    if (!rows.length) {
      container.appendChild(mk("div", "stats-empty", emptyText));
      return;
    }
    const max = rows[0].count || 1;
    rows.slice(0, 5).forEach(function (r) {
      const pct = Math.max(4, Math.round((r.count / max) * 100));
      const top = mk("div", "stats-row-top");
      top.appendChild(mk("span", "stats-row-label", r.label));
      top.appendChild(mk("span", "stats-row-count", r.count.toLocaleString("fr-FR")));
      const fill = mk("div", "stats-bar-fill");
      fill.style.width = pct + "%";
      const track = mk("div", "stats-bar-track");
      track.appendChild(fill);
      const row = mk("div", "stats-row");
      row.appendChild(top);
      row.appendChild(track);
      container.appendChild(row);
    });
  }

  function fillTooltip(node, name, count) {
    node.replaceChildren();
    node.appendChild(document.createTextNode(name + " \u2014 "));
    node.appendChild(mk("span", "tt-count", String(count)));
    node.appendChild(document.createTextNode(count > 1 ? " tentatives" : " tentative"));
  }

  return {
    CENTROIDS: CENTROIDS, countryName: countryName, parsePayload: parsePayload,
    pointsFromCountries: pointsFromCountries, featureCode: featureCode,
    rankCountries: rankCountries, formatDate: formatDate,
    renderStatList: renderStatList, fillTooltip: fillTooltip, mk: mk
  };
})();
</script>

<script>
(function () {
  const svg = d3.select("#map");
  const tooltip = d3.select("#tooltip");
  const counterValue = document.getElementById("counterValue");
  const statusText = document.getElementById("statusText");
  const updatedText = document.getElementById("updatedText");
  const rangeText = document.getElementById("rangeText");
  const statsPanel = document.getElementById("statsPanel");
  const statsToggle = document.getElementById("statsToggle");
  const detailCard = document.getElementById("detailCard");
  const detailClose = document.getElementById("detailClose");
  const detailCountry = document.getElementById("detailCountry");
  const detailCount = document.getElementById("detailCount");
  const detailSub = document.getElementById("detailSub");

  let width, height, projection, path, g, markerLayer;
  let worldData = null;
  let latestPoints = [];   // pays classes mais absents du fond de carte (petits territoires)
  let rankMap = {};        // code pays -> infos de classement (voir HP.rankCountries)
  let worldCodes = new Set();
  const rootStyle = getComputedStyle(document.documentElement);
  const heat = d3.interpolateRgb(
    rootStyle.getPropertyValue("--heat-low").trim() || "#6b3b1c",
    rootStyle.getPropertyValue("--heat-high").trim() || "#ff9a3d"
  );
  let latestTotal = 0;
  let selectedKey = null;

  let rotation = [-10, -18, 0];
  let dragging = false;
  let lastInteraction = 0;
  let baseScale = 1;
  let zoomK = 1;
  const sphere = { type: "Sphere" };

  // ---- Effet "flick" : lancer le globe d'un geste rapide, il tourne
  // vite puis ralentit progressivement jusqu'a retrouver la vitesse de
  // rotation par defaut, sans jamais s'arreter net.
  let spinVelocity = 0;     // vitesse actuelle pendant la decroissance (deg/s)
  let isFlicking = false;   // vrai tant que la decroissance n'a pas rejoint la vitesse par defaut
  let lastDragTime = 0;
  let smoothedVelocity = 0; // moyenne lissee de la vitesse pendant le glisser
  const FLICK_THRESHOLD = 60; // deg/s minimum pour compter comme un "lancer" plutot qu'un simple glisser
  const FLICK_DECAY_RATE = 1.1; // plus haut = ralentit plus vite

  // Panneau replie par defaut sous 860px, ouvert au-dessus
  function applyPanelDefault() {
    if (window.innerWidth <= 860) statsPanel.classList.add("collapsed");
    else statsPanel.classList.remove("collapsed");
  }
  applyPanelDefault();

  // Largeur reellement occupee par le panneau en ce moment (0 s'il est
  // replie) - utilisee pour centrer le globe dans l'espace restant a
  // gauche, pas sur toute la largeur de l'ecran.
  function getReservedPanelWidth() {
    if (statsPanel.classList.contains("collapsed")) return 0;
    return statsPanel.getBoundingClientRect().width;
  }

  function refreshProjectionLayout() {
    setupProjection();
    updateBase();
    renderMarkers(latestPoints);
    const empty = document.querySelector(".empty-state");
    if (empty) empty.style.right = getReservedPanelWidth() + "px";
  }

  statsToggle.addEventListener("click", function () {
    statsPanel.classList.toggle("collapsed");
    refreshProjectionLayout(); // le panneau change de largeur visible, le globe doit se recentrer
  });

  function setupProjection() {
    width = window.innerWidth;
    height = window.innerHeight;
    svg.attr("width", width).attr("height", height);

    // Centre le globe sur l'espace disponible a gauche du panneau de
    // statistiques, pas sur la largeur totale de l'ecran.
    const reservedWidth = getReservedPanelWidth();
    const availableWidth = Math.max(width - reservedWidth, 240);
    const centerX = availableWidth / 2;

    baseScale = Math.min(availableWidth, height) / 2.25;
    projection = d3.geoOrthographic()
      .scale(baseScale * zoomK)
      .translate([centerX, height / 2])
      .clipAngle(90)
      .rotate(rotation);

    path = d3.geoPath(projection);
  }

  setupProjection();
  g = svg.append("g");
  const graticule = d3.geoGraticule10();

  // Structure DOM creee une seule fois (sphere, graticule, groupe des
  // pays, groupe des points) - les rotations suivantes ne font que
  // mettre a jour les attributs "d"/"transform", sans jamais recreer les
  // noeuds, pour rester fluide meme en rotation continue.
  function initBase() {
    g.append("path").attr("class", "sphere").datum(sphere);
    g.append("path").attr("class", "graticule").datum(graticule);
    g.append("g").attr("class", "countries-layer");
    markerLayer = g.append("g").attr("class", "markers");
    updateBase();
  }

  function updateBase() {
    g.select(".sphere").attr("d", path);
    g.select(".graticule").attr("d", path);
    if (worldData) {
      g.select(".countries-layer").selectAll(".country")
        .data(worldData.features)
        .join(function (enter) {
          return enter.append("path")
            .on("mouseenter", onCountryEnter)
            .on("mousemove", onCountryMove)
            .on("mouseleave", onCountryLeave)
            .on("click", onCountryClick);
        })
        .attr("class", countryClass)
        .attr("d", path)
        .style("fill", countryFill);
    }
  }

  initBase();

  function countryClass(d) {
    const info = rankMap[d.code];
    return "country" + (info ? " has-data" : "") + (info && info.code === selectedKey ? " is-selected" : "");
  }

  // Plus le pays est haut dans le classement, plus l'orange est vif.
  function countryFill(d) {
    const info = rankMap[d.code];
    return info ? heat(info.t) : null;
  }

  function onCountryEnter(event, d) {
    const info = rankMap[d.code];
    if (!info) return;
    tooltip.style("opacity", 1);
    HP.fillTooltip(tooltip.node(), info.country, info.count);
  }

  function onCountryMove(event) {
    tooltip.style("left", (event.pageX + 14) + "px").style("top", (event.pageY - 10) + "px");
  }

  function onCountryLeave() { tooltip.style("opacity", 0); }

  function onCountryClick(event, d) {
    const info = rankMap[d.code];
    if (!info) return; // pays sans donnees : le clic ferme la fiche (svg)
    event.stopPropagation();
    showDetail(info);
  }

  function pointKey(d) { return d.code; }

  // Un point au dos du globe ne doit pas s'afficher : la projection
  // orthographique ne le fait pas disparaitre toute seule pour des
  // marqueurs places manuellement.
  function isFrontFacing(lon, lat) {
    const r = projection.rotate();
    const center = [-r[0], -r[1]];
    return d3.geoDistance([lon, lat], center) < (Math.PI / 2 - 0.02);
  }

  function showDetail(info) {
    selectedKey = info.code;
    const pct = latestTotal ? ((info.count / latestTotal) * 100).toFixed(1) : "0";
    detailCountry.textContent = info.country;
    detailCount.textContent = info.count.toLocaleString("fr-FR");
    detailSub.textContent = `${info.rank === 1 ? "1er" : info.rank + "ᵉ"} pays le plus actif — ${pct}% du total`;
    detailCard.classList.add("visible");
    updateBase();
    markerLayer.selectAll(".marker-dot")
      .classed("is-selected", dd => pointKey(dd) === selectedKey);
  }

  function hideDetail() {
    selectedKey = null;
    detailCard.classList.remove("visible");
    updateBase();
    if (markerLayer) markerLayer.selectAll(".marker-dot").classed("is-selected", false);
    lastInteraction = Date.now(); // redemarre le decompte avant reprise de la rotation
  }

  detailClose.addEventListener("click", hideDetail);
  svg.on("click", hideDetail);

  // Points uniquement pour les pays absents du fond de carte (Singapour,
  // petites iles...) : sans eux, leurs tentatives ne seraient pas visibles.
  function renderMarkers(points) {
    if (!markerLayer) return;
    const groups = markerLayer.selectAll("g.marker")
      .data(points, pointKey);

    groups.exit().remove();

    const entered = groups.enter().append("g").attr("class", "marker");
    entered.append("circle").attr("class", "marker-dot").attr("r", 3.5);

    const merged = entered.merge(groups)
      .style("display", d => isFrontFacing(d.lon, d.lat) ? null : "none")
      .attr("transform", d => {
        const proj = projection([d.lon, d.lat]);
        return proj ? `translate(${proj[0]},${proj[1]})` : "translate(-9999,-9999)";
      });

    merged.select(".marker-dot")
      .classed("is-selected", d => pointKey(d) === selectedKey)
      .style("fill", d => heat(rankMap[d.code] ? rankMap[d.code].t : 0))
      .on("mouseenter", function (event, d) {
        tooltip.style("opacity", 1);
        HP.fillTooltip(tooltip.node(), d.country, d.count);
      })
      .on("mousemove", onCountryMove)
      .on("mouseleave", onCountryLeave)
      .on("click", function (event, d) {
        event.stopPropagation();
        if (rankMap[d.code]) showDetail(rankMap[d.code]);
      });
  }

  // ---- Rotation : glisser a la souris/au doigt + rotation lente au repos ----
  function applyRotation(newRotation) {
    rotation = newRotation;
    projection.rotate(rotation);
    updateBase();
    renderMarkers(latestPoints);
  }

  const dragBehavior = d3.drag()
    .clickDistance(4) // laisse un vrai clic sur un point fonctionner normalement
    .filter(function (event) {
      // Un seul doigt (ou souris) fait tourner le globe ; deux doigts
      // sont reserves au pincement de zoom (voir zoomBehavior ci-dessous).
      return !event.touches || event.touches.length === 1;
    })
    .on("start", function () {
      dragging = true;
      isFlicking = false; // reprendre le globe en main annule toute decroissance en cours
      smoothedVelocity = 0;
      lastDragTime = performance.now();
      tooltip.style("opacity", 0);
    })
    .on("drag", function (event) {
      // Meme logique que pour la rotation automatique : compenser par
      // zoomK pour qu'un glisser d'une distance donnee tourne toujours
      // le globe d'un meme ressenti visuel, zoome ou non.
      const sensitivity = 0.28 / zoomK;
      const nextLambda = rotation[0] + event.dx * sensitivity;
      const nextPhi = Math.max(-90, Math.min(90, rotation[1] - event.dy * sensitivity));

      // Vitesse instantanee de ce mouvement, lissee sur les derniers
      // ticks pour capturer un "lancer" volontaire plutot que le bruit
      // d'un seul evenement de glisser.
      const now = performance.now();
      const dt = Math.max((now - lastDragTime) / 1000, 0.001);
      const instVelocity = (nextLambda - rotation[0]) / dt;
      smoothedVelocity = smoothedVelocity * 0.6 + instVelocity * 0.4;
      lastDragTime = now;

      applyRotation([nextLambda, nextPhi, 0]);
    })
    .on("end", function () {
      dragging = false;
      if (Math.abs(smoothedVelocity) > FLICK_THRESHOLD) {
        // Vrai "lancer" : le globe continue sur sa lancee, en ralentissant
        // progressivement (voir le timer plus bas), sans le delai habituel
        // avant reprise de la rotation automatique.
        spinVelocity = smoothedVelocity;
        isFlicking = true;
      } else {
        // Simple repositionnement : comportement habituel, pause avant
        // reprise de la rotation par defaut.
        lastInteraction = Date.now();
      }
    });

  svg.call(dragBehavior);

  // ---- Zoom : molette, pincement a deux doigts, boutons +/- ----
  const ZOOM_MIN = 0.5;
  const ZOOM_MAX = 4;

  function applyZoom(k) {
    zoomK = k;
    projection.scale(baseScale * zoomK);
    updateBase();
    renderMarkers(latestPoints);
  }

  const zoomBehavior = d3.zoom()
    .scaleExtent([ZOOM_MIN, ZOOM_MAX])
    .filter(function (event) {
      // Molette ou pincement a deux doigts uniquement - le glisser a un
      // seul doigt/bouton reste entierement gere par dragBehavior.
      return event.type === "wheel" || (event.touches && event.touches.length > 1);
    })
    .on("zoom", function (event) {
      lastInteraction = Date.now();
      applyZoom(event.transform.k);
    });

  svg.call(zoomBehavior);

  document.getElementById("zoomIn").addEventListener("click", function () {
    svg.transition().duration(200).call(zoomBehavior.scaleBy, 1.4);
  });
  document.getElementById("zoomOut").addEventListener("click", function () {
    svg.transition().duration(200).call(zoomBehavior.scaleBy, 1 / 1.4);
  });

  const AUTOROTATE_DEG_PER_SEC = 4;
  const RESUME_DELAY_MS = 5000;
  let lastElapsed = 0;

  d3.timer(function (elapsed) {
    const dt = elapsed - lastElapsed;
    lastElapsed = elapsed;
    if (dragging || selectedKey !== null) return;

    // Vitesse cible au repos, elle aussi compensee par le zoom (meme
    // raisonnement que l'ancienne rotation automatique fixe).
    const targetSpeed = AUTOROTATE_DEG_PER_SEC / zoomK;

    if (isFlicking) {
      const dtSeconds = dt / 1000;
      // Approche exponentielle vers la vitesse par defaut : rapide au
      // debut, de plus en plus doux, jamais d'arret net ni de a-coup.
      spinVelocity += (targetSpeed - spinVelocity) * (1 - Math.exp(-FLICK_DECAY_RATE * dtSeconds));
      applyRotation([rotation[0] + spinVelocity * dtSeconds, rotation[1], 0]);

      if (Math.abs(spinVelocity - targetSpeed) < 0.5) {
        isFlicking = false; // vitesse par defaut retrouvee, bascule silencieuse vers la rotation normale
      }
      return;
    }

    if (Date.now() - lastInteraction < RESUME_DELAY_MS) return;
    // Vitesse angulaire compensee par le zoom : a l'ecran, un meme
    // deplacement en degres parait plus rapide quand le globe est
    // agrandi. On divise par zoomK pour garder une vitesse visuelle
    // stable, que l'on soit zoome ou non.
    applyRotation([rotation[0] + targetSpeed * (dt / 1000), rotation[1], 0]);
  });

  function showEmptyState(message) {
    d3.select("#app").select(".empty-state").remove();
    const box = HP.mk("div", "empty-state");
    box.style.right = getReservedPanelWidth() + "px"; // centre sur le meme espace que le globe, pas tout l'ecran
    box.appendChild(HP.mk("div", "big", "Rien à afficher pour l'instant"));
    box.appendChild(HP.mk("div", "small", message));
    document.getElementById("app").appendChild(box);
  }

  function hideEmptyState() { d3.select("#app").select(".empty-state").remove(); }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  const STALE_AFTER_MS = 5 * 60 * 1000; // data.json est regenere chaque minute

  function applyPayload(json) {
    const data = HP.parsePayload(json);
    rankMap = HP.rankCountries(data.countries);
    latestPoints = HP.pointsFromCountries(data.countries).filter(p => !worldCodes.has(p.code));
    latestTotal = data.total;

    counterValue.textContent = latestTotal.toLocaleString("fr-FR");
    const known = data.countries.filter(c => c.code !== "Unknown").length;
    statusText.textContent = known
      ? known + (known > 1 ? " pays représentés" : " pays représenté")
      : "En attente de données";

    rangeText.textContent = data.since ? "Données depuis le " + HP.formatDate(data.since, true) : "";
    if (data.generatedAt) {
      const age = Date.now() - Date.parse(data.generatedAt);
      updatedText.textContent = "Dernière mise à jour : " + formatTime(data.generatedAt)
        + (age > STALE_AFTER_MS ? " (obsolète)" : "");
    } else {
      updatedText.textContent = "";
    }

    HP.renderStatList(document.getElementById("topCountries"),
      data.countries.map(c => ({ label: HP.countryName(c.code), count: c.count })), "Pas encore de données");
    HP.renderStatList(document.getElementById("topDates"),
      data.dates.slice().reverse().map(d => ({ label: HP.formatDate(d.date, false), count: d.count })),
      "Pas encore de données");
    HP.renderStatList(document.getElementById("topCommands"),
      data.commands.map(c => ({ label: c.command, count: c.count })), "Pas encore de données");

    // Pas de hideDetail() ici : ce rendu est aussi appele par le
    // rafraichissement automatique - la selection en cours ne doit pas
    // sauter a chaque fois.

    updateBase();
    renderMarkers(latestPoints);

    if (Object.keys(rankMap).length) {
      hideEmptyState();
    } else {
      showEmptyState("Aucune tentative enregistrée pour le moment. La carte se mettra à jour automatiquement dès qu'une attaque sera captée.");
    }
  }

  // Un seul etat affiche : les compteurs depuis le debut de la capture,
  // publies dans data.json par la Lambda "publisher" (EventBridge, chaque
  // minute) et rechargés ici toutes les 60 s.
  async function loadData() {
    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("data.json indisponible");
      applyPayload(await res.json());
    } catch (err) {
      statusText.textContent = "Données indisponibles";
      showEmptyState("Impossible de charger data.json. Vérifie que la Lambda publisher a bien tourné au moins une fois.");
    }
  }

  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(function (topo) {
      worldData = topojson.feature(topo, topo.objects.countries);
      worldData.features.forEach(function (f) { f.code = HP.featureCode(f); });
      worldCodes = new Set(worldData.features.map(f => f.code).filter(Boolean));
      updateBase();
      loadData();
    })
    .catch(function (err) {
      console.error("Echec du chargement du fond de carte (contours des pays) :", err);
      updateBase();
      loadData();
    });

  window.addEventListener("resize", function () {
    applyPanelDefault(); // met a jour l'etat replie/ouvert AVANT le calcul de projection
    refreshProjectionLayout();
  });

  setInterval(loadData, 60000);
})();
</script>
</body>
</html>
